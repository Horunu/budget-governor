[project]
name = "budget-governor-reconciliation"
version = "0.1.0"
description = "Budget Governor reconciliation job: gateway-observed spend vs. provider-billed spend drift detection"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31,<0.32",
    "httpx>=0.28,<0.29",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["usage_providers*"]
