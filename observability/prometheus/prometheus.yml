global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Alertmanager not deployed in this build; alerts are
                        # visible in Prometheus's own Alerts UI and are
                        # written to be Alertmanager-ready (just add a
                        # target here) -- see docs/DECISIONS.md.

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          service: gateway

  - job_name: controlplane
    metrics_path: /metrics
    static_configs:
      - targets: ["controlplane:8081"]
        labels:
          service: controlplane

  - job_name: advisor
    metrics_path: /metrics
    static_configs:
      - targets: ["advisor:8082"]
        labels:
          service: advisor

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: postgres

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: redis

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: host

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
