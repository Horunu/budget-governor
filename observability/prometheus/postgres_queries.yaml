# Custom queries for prometheus-community/postgres_exporter
# (https://github.com/prometheus-community/postgres_exporter), mounted
# via its --extend.query-path flag (see deploy/docker-compose.yml).
#
# Reconciliation drift is computed by a batch job (reconciliation/job.py)
# and only ever lands in Postgres -- there is no live service to scrape
# it from directly. Exposing it here as a gauge is what lets
# observability/prometheus/alerts.yml's ReconciliationDriftHigh rule
# (plain PromQL) see it at all.
pg_reconciliation_drift:
  query: |
    SELECT DISTINCT ON (tenant_id)
      tenant_id,
      drift_pct,
      drift_amount_usd,
      gateway_observed_usd,
      provider_reported_usd,
      extract(epoch from created_at) AS observed_at_unixtime
    FROM reconciliation_drift
    WHERE resolved_at IS NULL
    ORDER BY tenant_id, created_at DESC
  metrics:
    - tenant_id:
        usage: LABEL
        description: Tenant this drift measurement belongs to.
    - drift_pct:
        usage: GAUGE
        description: Most recent unresolved reconciliation drift, as a fraction (0.10 = 10%).
    - drift_amount_usd:
        usage: GAUGE
        description: Most recent unresolved reconciliation drift amount, in USD.
    - gateway_observed_usd:
        usage: GAUGE
        description: Gateway-observed spend for the reconciled window, in USD.
    - provider_reported_usd:
        usage: GAUGE
        description: Provider-billed spend for the reconciled window, in USD.
    - observed_at_unixtime:
        usage: GAUGE
        description: Unix timestamp the underlying reconciliation_drift row was created.

# Per-member (and team-wide) spend over the last 24h against each dollar
# cap, so alerts can name the person who is close to their limit. The
# gateway's own saturation gauge only covers token limits and carries no
# agent label. Caps set by scripts/team.py refill evenly over 24h, so
# 24h spend at or above the cap means that bucket is effectively empty.
pg_member_budget:
  query: |
    SELECT
      t.name AS team,
      COALESCE(a.name, '(team total)') AS member,
      b.dollar_limit AS cap_usd,
      COALESCE(SUM(s.cost_usd), 0) AS spent_24h_usd,
      COALESCE(SUM(s.cost_usd), 0) / b.dollar_limit AS used_ratio
    FROM budgets b
    JOIN tenants t ON t.id = b.tenant_id
    LEFT JOIN agents a ON a.id = b.agent_id
    LEFT JOIN spend_events s
      ON s.tenant_id = b.tenant_id
     AND (b.agent_id IS NULL OR s.agent_id = b.agent_id)
     AND s.created_at > now() - interval '24 hours'
    WHERE b.task_id IS NULL AND b.dollar_limit > 0
    GROUP BY t.name, a.name, b.dollar_limit
  metrics:
    - team:
        usage: LABEL
        description: Tenant (team) name.
    - member:
        usage: LABEL
        description: Agent (member) name, or "(team total)" for the tenant-wide cap.
    - cap_usd:
        usage: GAUGE
        description: Dollar cap on this budget.
    - spent_24h_usd:
        usage: GAUGE
        description: Spend recorded in the last 24h against this budget, in USD.
    - used_ratio:
        usage: GAUGE
        description: spent_24h_usd / cap_usd (1.0 = cap fully used).
