[project]
name = "budget-governor-controlplane"
version = "0.1.0"
description = "Budget Governor control plane: tenant/agent/budget management and spend queries"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "bcrypt>=5.0,<6",
    "httpx>=0.28,<0.29",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "aiosqlite>=0.22,<0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
